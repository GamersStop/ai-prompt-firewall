name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: 'Target registry to publish to'
        required: true
        default: 'npm'
        type: choice
        options:
          - npm
          - github
          - both

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Run unit & benchmark test suites
        run: npm test

      - name: Compile build bundle and declaration maps
        run: npm run build

  publish:
    name: Publish to Package Registry
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (npm Registry)
        if: ${{ github.event_name == 'release' || inputs.registry == 'npm' || inputs.registry == 'both' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build production bundle
        run: npm run build

      - name: Publish to npmjs.org
        if: ${{ github.event_name == 'release' || inputs.registry == 'npm' || inputs.registry == 'both' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --registry=https://registry.npmjs.org --access public --provenance

      - name: Setup Node.js (GitHub Packages)
        if: ${{ inputs.registry == 'github' || inputs.registry == 'both' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        if: ${{ inputs.registry == 'github' || inputs.registry == 'both' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish
